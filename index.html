<!doctype html>
<html lang="en" data-theme="cream">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var t = params.get('theme');
          if (!t || !['cream', 'pearl', 'sand', 'dark'].includes(t)) {
            t = localStorage.getItem('erp_theme');
          }
          if (!t || t === 'undefined' || t === 'null' || !['cream', 'pearl', 'sand', 'dark'].includes(t)) {
            t = 'cream';
            localStorage.setItem('erp_theme', 'cream');
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>
    <title>Restaurant Supply ERP &amp; Profit Intelligence</title>
    <meta name="description" content="AI-powered wholesale restaurant supply management, order taking, inventory costing, multi-method expense allocation, and profit intelligence." />
    <meta property="og:title" content="Restaurant Supply ERP &amp; Profit Intelligence" />
    <meta property="og:description" content="AI-powered wholesale restaurant supply management, order taking, inventory costing, multi-method expense allocation, and profit intelligence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </body>
</html>
